<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Badminton Tournament</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fff6d6;--card:#ffffff;--ink:#0a1020;--mute:#3d4660;--line:#0a1020;--acc:#00a651;--accink:#ffffff;--acc2:#c9f7dc;--warn:#ff5a00;--win:#b6f5cf;--hdr:#0b2a6f;--court:#ff5a00}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#16203a;--ink:#ffffff;--mute:#c4cee8;--line:#5f7bc4;--acc:#2ee67a;--accink:#04210f;--acc2:#12402a;--warn:#ff9a3d;--win:#115c36;--hdr:#050a1a;--court:#ffb020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{padding:18px 16px 6px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
main{max-width:720px;margin:0 auto;padding:0 16px}
h2{font-size:17px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-weight:500;color:var(--mute);font-size:14px}
.now{background:var(--acc);color:var(--accink);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.empty{color:var(--mute);text-align:center;padding:26px 12px}
.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.court{font-weight:700;color:var(--acc)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.tm{padding:8px;border-radius:10px;border:1px solid transparent}
.tm b{display:block;font-size:16px}
.tm small{color:var(--mute);font-size:12px;display:block}
.tm.right{text-align:right}
.tm.win{background:var(--win);border-color:var(--acc)}
.x{color:var(--mute);font-size:13px}
.g{border-top:1px solid var(--line);padding:8px 0 2px}
.gl{font-size:12px;color:var(--mute);margin-bottom:4px}
.gr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.gr .p{font-size:13px;line-height:1.25}
.gr .p.r{text-align:right}
.sc{width:58px;height:46px;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sc:focus,.in:focus{outline:2px solid var(--acc);outline-offset:0}
.scs{display:flex;gap:6px;align-items:center}
.st{margin-top:8px;font-size:14px;font-weight:600;color:var(--acc)}
.st.pend{color:var(--mute);font-weight:500}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.flash{font-size:24px;font-weight:800;text-align:center;padding:22px 8px;background:var(--acc2);border-radius:12px;min-height:76px}
.flash small{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:4px}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grp h3{margin:0 0 6px;font-size:14px}
.grp ol{margin:0;padding-left:20px}
.grp li{padding:2px 0}
.in{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
@media (max-width:480px){.trio{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mute);text-transform:uppercase}
td.l,th.l{text-align:left}
tr.cup td{background:var(--win)}
.note{font-size:13px;color:var(--mute);margin:8px 2px}
.champ{background:var(--acc);color:var(--accink);border-radius:14px;padding:16px;text-align:center;font-size:18px;font-weight:800;margin:10px 0}
.champ small{display:block;font-weight:500;font-size:13px;opacity:.85}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:720px;width:100%}
nav button{flex:1;background:none;border:0;padding:12px 4px;font-size:14px;color:var(--mute);font-weight:600;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}

body{font-weight:500}
header{max-width:none;background:var(--hdr);color:#fff;padding:16px 16px 14px;margin:0 0 6px}
header h1,header p{max-width:720px;margin-left:auto;margin-right:auto;color:#fff}
header h1{font-size:24px;font-weight:900}
header p{opacity:.9;font-size:15px;font-weight:600}
h2{font-size:20px;font-weight:900}
.card{border:2px solid var(--line);border-radius:16px}
.court{color:#fff;background:var(--court);padding:3px 10px;border-radius:99px;font-weight:900;letter-spacing:0}
.mh{font-weight:800;color:var(--mute)}
.tm b{font-size:18px;font-weight:900}
.tm small,.gl,.note{color:var(--mute);font-weight:600}
.gl{font-weight:800}
.gr .p{font-size:14px;font-weight:700}
.sc{border:2px solid var(--line);font-weight:900;font-size:22px;background:var(--card)}
.st{font-weight:800;font-size:15px}
.btn{font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.ghost{border:2px solid var(--line);box-shadow:none;font-weight:800}
.now{background:var(--court);color:#fff;font-size:12px;font-weight:900;padding:3px 10px}
.flash{background:var(--acc2);border:2px solid var(--acc);font-weight:900}
.in{border:2px solid var(--line);font-weight:700;background:var(--card)}
th{color:var(--mute);font-weight:800}
td,th{border-bottom:1px solid rgba(100,110,140,.45)}
tr.cup td{background:var(--win);font-weight:800}
.champ{background:var(--acc);font-weight:900;font-size:20px}
nav{border-top:3px solid var(--hdr)}
nav button{font-weight:800;font-size:15px;color:var(--mute)}
nav button.on{color:var(--acc);box-shadow:inset 0 4px 0 var(--acc);background:var(--acc2)}

.sc:disabled{opacity:1;-webkit-text-fill-color:var(--ink);background:var(--card)}
.next{background:var(--acc);color:var(--accink);border-radius:16px;padding:14px;margin:10px 0;font-weight:900;font-size:18px;line-height:1.35}
.next small{display:block;font-weight:700;font-size:14px;opacity:.95;margin-top:4px}
select.in{font-weight:800}
</style>
</head>
<body>
<header>
  <h1>🏸 Badminton Tournament</h1>
  <p>8 teams of 3. Each tie has 3 games to 15 points.</p>
</header>
<main id="app"></main>
<nav><div id="tabs"></div></nav>

<datalist id="dl-m"></datalist>
<datalist id="dl-w"></datalist>

<script>
const KEY = "bt_tournament_v1";
const VIEW = /\/watch\/?$/.test(location.pathname) || /[?&]view=1/.test(location.search);
const MEN = ["Arjun","Bharani","Chandru","Dinesh","Harikumar","Praveen","Shankar","Harish","Prabhu","Justin","Manoj","Prem","Rupesh","Sai","Shashank","Karthik","Yuvaraj","Karan"];
const WOMEN = ["Bharani","Meenakshi","Nandhini","Hema","Radha","Vidhu","Pradhu","Nandini"];
const BR = { Cup: "Champions League", Plate: "FPL" };
const GAME_LABELS = ["Men's doubles", "Mixed doubles 1", "Mixed doubles 2"];

const defaults = () => ({
  settings: { start: "09:00", gameMin: 12, breakMin: 5 },
  teams: Array.from({ length: 8 }, (_, i) => ({ name: "Team " + (i + 1), m1: "", m2: "", w: "" })),
  drawn: [],
  scores: {},
  who: {}
});

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function load() {
  if (VIEW) return defaults();
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const o = JSON.parse(r); return Object.assign(defaults(), o); }
  } catch (e) {}
  return defaults();
}
function store() { lsSet(KEY, JSON.stringify(S)); }
function save() { if (VIEW) return; store(); edits++; setSync(undefined, true); schedulePush(); }

let S = load();
let tab = VIEW ? "me" : (S.drawn.length >= 8 ? "sched" : "setup");
let busy = false, flashTeam = null, pendingRender = false;
let pushTimer = null, liveMsg = "", lastSig = "", updMsg = "";
// serverRev: the server revision this device last matched (null = never synced).
// dirty: this device has edits the server has not received.
let serverRev = lsGet("bt_rev") === null ? null : +lsGet("bt_rev");
let dirty = lsGet("bt_dirty") === "1", edits = 0;
function setSync(rev, d) {
  if (rev !== undefined) { serverRev = rev; lsSet("bt_rev", String(rev)); }
  dirty = d; lsSet("bt_dirty", d ? "1" : "");
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };

/* ---------- teams and groups ---------- */
const tn = t => t == null ? "To be decided" : (S.teams[t].name || "Team " + (t + 1));
const tp = t => {
  if (t == null) return "";
  const x = S.teams[t];
  const men = [x.m1, x.m2].filter(Boolean).join(" and ");
  return [men, x.w].filter(Boolean).join(" + ");
};
function groups() {
  if (S.drawn.length < 8) return null;
  return { A: S.drawn.slice(0, 4), B: S.drawn.slice(4, 8) };
}
function pairOf(t, i) {
  const x = S.teams[t];
  const a = x.m1 || "Man 1", b = x.m2 || "Man 2", w = x.w || "Woman";
  return i === 0 ? a + " and " + b : i === 1 ? a + " and " + w : b + " and " + w;
}

/* ---------- fixtures ---------- */
const PR = [[[0, 3], [1, 2]], [[0, 2], [3, 1]], [[0, 1], [2, 3]]];
function prelims() {
  const g = groups(); if (!g) return [];
  const out = [];
  for (let r = 0; r < 3; r++) {
    let c = 1;
    for (const gk of ["A", "B"]) {
      for (const [x, y] of PR[r]) {
        out.push({ id: gk + (r + 1) + "-" + (x + 1) + "v" + (y + 1), round: r + 1, court: c++, stage: "Group " + gk, label: "", a: g[gk][x], b: g[gk][y] });
      }
    }
  }
  return out;
}

// Scores belong to the two teams they were entered for. If a corrected
// earlier result puts different teams in a playoff match, its old scores are ignored.
function scoresOf(m) {
  const w = S.who && S.who[m.id];
  if (w && (w[0] !== m.a || w[1] !== m.b)) return [];
  return S.scores[m.id] || [];
}
function game(m, i) {
  const s = scoresOf(m)[i];
  if (!s) return null;
  const a = s[0], b = s[1];
  if (a === "" || b === "" || a == null || b == null || +a === +b) return null;
  return { a: +a, b: +b, w: +a > +b ? 0 : 1 };
}
// A finished game to 15 with no cap: 15 to 13 or less, or won by exactly 2 after 14-all.
function validGame(g) {
  const hi = Math.max(g.a, g.b), lo = Math.min(g.a, g.b);
  return hi === 15 ? lo <= 13 : hi > 15 && hi - lo === 2;
}
function res(m) {
  const gs = [0, 1, 2].map(i => game(m, i));
  const gw = [0, 0], pt = [0, 0];
  gs.forEach(g => { if (g) { gw[g.w]++; pt[0] += g.a; pt[1] += g.b; } });
  const done = gs.every(Boolean);
  return { gs, done, gw, pt, winner: done ? (gw[0] > gw[1] ? 0 : 1) : null, played: gs.filter(Boolean).length };
}
function winnerTeam(m) { if (m.a == null || m.b == null) return null; const r = res(m); return r.done ? (r.winner === 0 ? m.a : m.b) : null; }
function loserTeam(m) { if (m.a == null || m.b == null) return null; const r = res(m); return r.done ? (r.winner === 0 ? m.b : m.a) : null; }

function h2h(x, y) {
  const m = prelims().find(m => (m.a === x && m.b === y) || (m.a === y && m.b === x));
  if (!m) return 0;
  const w = winnerTeam(m);
  return w === x ? -1 : w === y ? 1 : 0;
}
function table(gk) {
  const g = groups()[gk], st = {};
  g.forEach(t => st[t] = { t, p: 0, w: 0, l: 0, gw: 0, gl: 0, pf: 0, pa: 0 });
  prelims().filter(m => m.stage === "Group " + gk).forEach(m => {
    const r = res(m); if (!r.done) return;
    const A = st[m.a], B = st[m.b];
    A.p++; B.p++;
    A.gw += r.gw[0]; A.gl += r.gw[1]; B.gw += r.gw[1]; B.gl += r.gw[0];
    A.pf += r.pt[0]; A.pa += r.pt[1]; B.pf += r.pt[1]; B.pa += r.pt[0];
    if (r.winner === 0) { A.w++; B.l++; } else { B.w++; A.l++; }
  });
  const arr = Object.values(st);
  arr.forEach(x => x.pd = x.pf - x.pa);
  arr.sort((x, y) => y.w - x.w || y.gw - x.gw || y.pd - x.pd || x.t - y.t);
  // Teams level on all three: order them by ties won against each other.
  for (let i = 0; i < arr.length;) {
    let j = i + 1;
    while (j < arr.length && arr[j].w === arr[i].w && arr[j].gw === arr[i].gw && arr[j].pd === arr[i].pd) j++;
    if (j - i > 1) {
      const blk = arr.slice(i, j), ts = blk.map(x => x.t);
      const mini = t => ts.filter(o => o !== t && h2h(t, o) === -1).length;
      blk.sort((x, y) => mini(y.t) - mini(x.t) || x.t - y.t);
      arr.splice(i, j - i, ...blk);
    }
    i = j;
  }
  return arr;
}
function prelimsDone() { return !!groups() && prelims().every(m => res(m).done); }
function seeds() {
  if (!prelimsDone()) return null;
  const tA = table("A"), tB = table("B");
  const cmp = (x, y) => y.w - x.w || y.gw - x.gw || y.pd - x.pd || x.t - y.t;
  return {
    Cup: [...tA.slice(0, 2), ...tB.slice(0, 2)].sort(cmp).map(x => x.t),
    Plate: [...tA.slice(2), ...tB.slice(2)].sort(cmp).map(x => x.t)
  };
}
function playoffs() {
  const sd = seeds(), out = [];
  for (const br of ["Cup", "Plate"]) {
    const s = sd ? sd[br] : [null, null, null, null];
    const c = br === "Cup" ? [1, 2, 1, 1] : [3, 4, 2, 2];
    const q1 = { id: br + "Q1", round: 4, court: c[0], stage: BR[br], label: "Qualifier 1", a: s[0], b: s[1], la: BR[br] + " seed 1", lb: BR[br] + " seed 2" };
    const el = { id: br + "E", round: 4, court: c[1], stage: BR[br], label: "Eliminator", a: s[2], b: s[3], la: BR[br] + " seed 3", lb: BR[br] + " seed 4" };
    const q2 = { id: br + "Q2", round: 5, court: c[2], stage: BR[br], label: "Qualifier 2", a: loserTeam(q1), b: winnerTeam(el), la: "Loser of Qualifier 1", lb: "Winner of Eliminator" };
    const f = { id: br + "F", round: 6, court: c[3], stage: BR[br], label: "Final", a: winnerTeam(q1), b: winnerTeam(q2), la: "Winner of Qualifier 1", lb: "Winner of Qualifier 2" };
    out.push(q1, el, q2, f);
  }
  return out;
}
function allMatches() {
  return prelims().concat(playoffs()).sort((x, y) => x.round - y.round || x.court - y.court);
}
function currentRound(all) {
  const p = all.filter(m => !res(m).done);
  return p.length ? Math.min(...p.map(m => m.round)) : null;
}
function rt(r) {
  const [h, m] = S.settings.start.split(":").map(Number);
  const per = 3 * S.settings.gameMin + S.settings.breakMin;
  return fmt(h * 60 + m + (r - 1) * per);
}
function fmt(t) { return String(Math.floor(t / 60) % 24).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
function endTime() {
  const [h, m] = S.settings.start.split(":").map(Number);
  const per = 3 * S.settings.gameMin + S.settings.breakMin;
  return fmt(h * 60 + m + 6 * per - S.settings.breakMin);
}

/* ---------- views ---------- */
function stat(m) {
  const r = res(m);
  if (m.a == null || m.b == null) return "Waiting for earlier results";
  const bad = [0, 1, 2].filter(i => r.gs[i] && !validGame(r.gs[i])).map(i => i + 1);
  const warn = bad.length ? ". Check game " + bad.join(" and ") + ": not a finished score" : "";
  if (r.done) return tn(r.winner === 0 ? m.a : m.b) + " win the tie, " + Math.max(...r.gw) + " games to " + Math.min(...r.gw) + warn;
  return r.played + " of 3 games entered" + warn;
}
function card(m) {
  const r = res(m), ready = m.a != null && m.b != null;
  const nameA = ready ? tn(m.a) : m.la, nameB = ready ? tn(m.b) : m.lb;
  let h = `<div class="card" data-card="${m.id}"><div class="mh"><span>${esc(m.stage)}${m.label ? " &middot; " + esc(m.label) : ""}</span><span class="court">Court ${m.court}</span></div>`;
  h += `<div class="vs"><div class="tm ${r.done && r.winner === 0 ? "win" : ""}"><b>${esc(nameA)}</b><small>${ready ? esc(tp(m.a)) : ""}</small></div><div class="x">v</div><div class="tm right ${r.done && r.winner === 1 ? "win" : ""}"><b>${esc(nameB)}</b><small>${ready ? esc(tp(m.b)) : ""}</small></div></div>`;
  if (ready) {
    for (let i = 0; i < 3; i++) {
      const s = scoresOf(m)[i] || ["", ""];
      h += `<div class="g"><div class="gl">Game ${i + 1}: ${GAME_LABELS[i]}</div><div class="gr"><div class="p">${esc(pairOf(m.a, i))}</div><div class="scs"><input class="sc" type="number" inputmode="numeric" min="0" max="40" data-id="${m.id}" data-g="${i}" data-s="0" value="${esc(s[0])}" ${VIEW ? "disabled" : ""}><span>:</span><input class="sc" type="number" inputmode="numeric" min="0" max="40" data-id="${m.id}" data-g="${i}" data-s="1" value="${esc(s[1])}" ${VIEW ? "disabled" : ""}></div><div class="p r">${esc(pairOf(m.b, i))}</div></div></div>`;
    }
  }
  h += `<div class="st ${r.done ? "" : "pend"}">${esc(stat(m))}</div></div>`;
  return h;
}

function vSetup() {
  const g = groups();
  const ordA = S.drawn.slice(0, 4), ordB = S.drawn.slice(4, 8);
  let fl = "Press the button to draw";
  if (flashTeam != null) {
    const p = S.drawn.indexOf(flashTeam);
    fl = esc(tn(flashTeam)) + `<small>Group ${p < 4 ? "A" : "B"}, seat ${(p % 4) + 1}</small>`;
  } else if (g) fl = "Draw complete";
  let h = `<h2>Group draw</h2><div class="card"><div class="flash" id="flash">${fl}</div>
  <div class="row"><button class="btn" data-act="next" ${S.drawn.length >= 8 ? "disabled" : ""}>Draw next team (${S.drawn.length}/8)</button>
  <button class="btn ghost" data-act="all" ${S.drawn.length >= 8 ? "disabled" : ""}>Draw all</button>
  <button class="btn ghost" data-act="redo">Redo draw</button></div>
  <div class="grp"><div><h3>Group A</h3><ol>${ordA.map(t => `<li>${esc(tn(t))}</li>`).join("") || "<li style='list-style:none;color:var(--mute)'>Empty</li>"}</ol></div>
  <div><h3>Group B</h3><ol>${ordB.map(t => `<li>${esc(tn(t))}</li>`).join("") || "<li style='list-style:none;color:var(--mute)'>Empty</li>"}</ol></div></div>
  <div class="note">The first 4 teams drawn go to Group A. The last 4 go to Group B. Draw order sets the seat number.</div></div>`;

  h += `<h2>Teams</h2><div class="note">Man 1 plays men's doubles and Mixed 1. Man 2 plays men's doubles and Mixed 2. The woman plays both mixed games.</div>`;
  h += S.teams.map((t, i) => `<div class="card"><div class="mh"><span>Team ${i + 1}</span></div>
  <input class="in" data-t="${i}" data-f="name" value="${esc(t.name)}" placeholder="Team name">
  <div class="trio"><input class="in" list="dl-m" data-t="${i}" data-f="m1" placeholder="Man 1" value="${esc(t.m1)}"><input class="in" list="dl-m" data-t="${i}" data-f="m2" placeholder="Man 2" value="${esc(t.m2)}"><input class="in" list="dl-w" data-t="${i}" data-f="w" placeholder="Woman" value="${esc(t.w)}"></div></div>`).join("");

  h += `<h2>Timing</h2><div class="card"><label class="f">Start time</label><input class="in" type="time" data-set="start" value="${esc(S.settings.start)}">
  <label class="f">Planned minutes per game</label><input class="in" type="number" inputmode="numeric" data-set="gameMin" value="${S.settings.gameMin}">
  <label class="f">Break between rounds (minutes)</label><input class="in" type="number" inputmode="numeric" data-set="breakMin" value="${S.settings.breakMin}">
  <div class="note">6 rounds. Planned finish: ${endTime()}. The times only guide you. Games run to 15 points with no cap. A score that is not a finished game gets a "check" note.</div></div>`;

  h += liveCard();
  h += `<h2>Backup</h2><div class="card"><div class="note" style="margin-top:0">Scores save on this device. With the admin PIN they also go to the server. Use one phone for score entry.</div>
  <div class="row"><button class="btn ghost" data-act="export">Copy backup</button><button class="btn ghost" data-act="import">Restore backup</button><button class="btn ghost" data-act="reset">Reset everything</button></div></div>`;
  return h;
}

function vSched() {
  if (!groups()) return `<div class="card empty">Draw the groups first. Open the Setup tab.</div>`;
  const all = allMatches(), cur = currentRound(all);
  const names = ["", "Group round 1", "Group round 2", "Group round 3", "Playoffs round 1", "Playoffs round 2", "Playoffs round 3"];
  let h = "";
  if (cur == null) h += `<div class="champ">Tournament finished 🎉</div>`;
  for (let r = 1; r <= 6; r++) {
    h += `<h2>${names[r]} <span class="time">planned ${rt(r)}</span>${cur === r ? '<span class="now">NOW</span>' : ""}</h2>`;
    h += all.filter(m => m.round === r).map(card).join("");
    if (r >= 5) h += `<div class="note">Courts 3 and 4 are free in this round. Use them for fun games.</div>`;
  }
  return h;
}

function vTables() {
  if (!groups()) return `<div class="card empty">Draw the groups first. Open the Setup tab.</div>`;
  let h = "";
  for (const gk of ["A", "B"]) {
    const t = table(gk);
    h += `<h2>Group ${gk}</h2><div class="card"><table><tr><th class="l">#</th><th class="l">Team</th><th>P</th><th>W</th><th>L</th><th>GW</th><th>GL</th><th>PD</th></tr>`;
    h += t.map((x, i) => `<tr class="${i < 2 ? "cup" : ""}"><td class="l">${i + 1}</td><td class="l"><b>${esc(tn(x.t))}</b></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.gw}</td><td>${x.gl}</td><td>${x.pd > 0 ? "+" : ""}${x.pd}</td></tr>`).join("");
    h += `</table></div>`;
  }
  h += `<div class="note">Green rows go to the Champions League. The other two teams go to the FPL.<br>P played, W ties won, L ties lost, GW games won, GL games lost, PD point difference.<br>Order: ties won, then games won, then point difference, then ties won between the level teams.</div>`;
  const sd = seeds();
  if (sd) {
    h += `<h2>Playoff seeds</h2><div class="card"><b>Champions League</b><ol>${sd.Cup.map(t => `<li>${esc(tn(t))}</li>`).join("")}</ol><b>FPL</b><ol>${sd.Plate.map(t => `<li>${esc(tn(t))}</li>`).join("")}</ol></div>`;
  }
  return h;
}

function vPo() {
  if (!groups()) return `<div class="card empty">Draw the groups first. Open the Setup tab.</div>`;
  const po = playoffs();
  let h = `<div class="note">IPL format. Seed 1 plays seed 2 in Qualifier 1. Seed 3 plays seed 4 in the Eliminator. The Qualifier 1 loser plays the Eliminator winner in Qualifier 2. The two winners play the Final.</div>`;
  if (!prelimsDone()) h += `<div class="card empty">Playoffs start when all group ties are scored.</div>`;
  for (const br of ["Cup", "Plate"]) {
    const ms = po.filter(m => m.id.startsWith(br));
    const f = ms.find(m => m.label === "Final"), w = winnerTeam(f);
    h += `<h2>${BR[br]}</h2>`;
    if (w != null) h += `<div class="champ">${br === "Cup" ? "🏆" : "🥈"} ${esc(tn(w))}<small>${esc(tp(w))}</small></div>`;
    h += ms.map(card).join("");
  }
  return h;
}

/* ---------- render ---------- */
const TABS = VIEW ? [["me", "My matches"], ["sched", "All matches"], ["tables", "Tables"], ["po", "Playoffs"]] : [["setup", "Setup"], ["sched", "Matches"], ["tables", "Tables"], ["po", "Playoffs"]];
function render() {
  const y = window.scrollY;
  pendingRender = false;
  // Keep focus on the same field so a redraw does not swallow typing.
  const a = document.activeElement;
  const sel = a && a.closest && a.closest("#app") ? Object.keys(a.dataset).map(k => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join("") : "";
  const v = { setup: vSetup, me: vMe, sched: vSched, tables: vTables, po: vPo }[tab];
  document.getElementById("app").innerHTML = v();
  document.getElementById("tabs").innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${n}</button>`).join("");
  if (sel) { const n = document.querySelector("#app " + sel); if (n) n.focus({ preventScroll: true }); }
  window.scrollTo(0, y);
}

/* ---------- draw ---------- */
function drawNext() {
  if (busy || S.drawn.length >= 8) return;
  busy = true;
  const rem = [0, 1, 2, 3, 4, 5, 6, 7].filter(t => !S.drawn.includes(t));
  const pick = rem[rnd(rem.length)], s0 = S;
  const el = document.getElementById("flash");
  document.querySelectorAll("[data-act]").forEach(b => b.disabled = true);
  let n = 0;
  const iv = setInterval(() => {
    if (el) el.textContent = tn(rem[rnd(rem.length)]);
    if (++n >= 14) {
      clearInterval(iv);
      busy = false;
      // The state was replaced (for example loaded from the server) during the animation.
      if (S !== s0 || S.drawn.includes(pick) || S.drawn.length >= 8) { render(); return; }
      S.drawn.push(pick); flashTeam = pick;
      save(); render();
    }
  }, 80);
}
function drawAll() {
  if (busy) return;
  while (S.drawn.length < 8) {
    const rem = [0, 1, 2, 3, 4, 5, 6, 7].filter(t => !S.drawn.includes(t));
    S.drawn.push(rem[rnd(rem.length)]);
  }
  flashTeam = null; save(); render();
}

/* ---------- player view ---------- */
function vMe() {
  const g = groups();
  if (!g) return `<div class="card empty">The teams are not drawn yet. This page updates by itself. Check back soon.</div>`;
  const opts = [];
  S.teams.forEach((t, i) => [t.m1, t.m2, t.w].forEach(n => { if (n) opts.push([n, i]); }));
  opts.sort((a, b) => a[0].localeCompare(b[0]));
  let me = ""; try { me = localStorage.getItem("bt_me") || ""; } catch (e) {}
  let h = `<h2>Who are you?</h2><div class="card"><select class="in" data-me="1"><option value="">Choose your name</option>`
    + opts.map(([n, i]) => { const v = i + "|" + n; return `<option value="${esc(v)}" ${v === me ? "selected" : ""}>${esc(n)}</option>`; }).join("")
    + `<optgroup label="Or choose your team">` + S.teams.map((t, i) => `<option value="${i}|" ${(i + "|") === me ? "selected" : ""}>${esc(tn(i))}</option>`).join("") + `</optgroup></select></div>`;
  const idx = me ? parseInt(me.split("|")[0], 10) : NaN;
  if (isNaN(idx) || !S.teams[idx]) return h + `<div class="card empty">Choose your name to see your matches.</div>`;
  const mine = allMatches().filter(m => m.a === idx || m.b === idx);
  const gk = g.A.includes(idx) ? "A" : "B";
  const tbl = table(gk), pos = tbl.findIndex(x => x.t === idx), rec = tbl[pos];
  h += `<div class="card"><b style="font-size:19px">${esc(tn(idx))}</b><div class="note" style="margin:2px 0 0">${esc(tp(idx))}</div><div class="note" style="margin:6px 0 0">Group ${gk}, position ${pos + 1}. Ties won: ${rec.w} of ${rec.p} played.</div></div>`;
  const nxt = mine.find(m => !res(m).done && m.a != null && m.b != null);
  if (nxt) {
    const opp = nxt.a === idx ? nxt.b : nxt.a;
    h += `<div class="next">Next: round ${nxt.round}, planned ${rt(nxt.round)}<br>Court ${nxt.court} against ${esc(tn(opp))}<small>${esc(nxt.stage)}${nxt.label ? " &middot; " + esc(nxt.label) : ""}</small></div>`;
  } else {
    h += `<div class="next">No match is waiting now.<small>${prelimsDone() ? "Check the Playoffs tab." : "Wait for the other group ties to finish."}</small></div>`;
  }
  h += `<h2>Your matches</h2>`;
  h += mine.map(m => `<div class="note"><b>Round ${m.round}, planned ${rt(m.round)}</b></div>` + card(m)).join("");
  h += `<div class="note">Playoff matches appear here when your team qualifies. Times are planned. Courts call you when it is your turn.</div>`;
  return h;
}

/* ---------- live sharing ---------- */
const hhmm = () => new Date().toTimeString().slice(0, 5);
const getPin = () => lsGet("bt_pin") || "";
function liveCard() {
  return `<h2>Live link for players</h2><div class="card"><div class="note" style="margin-top:0">Players open this link on their phones. They choose their name and see only their matches.</div>
  <input class="in" readonly value="${esc(location.origin + "/watch")}">
  <label class="f">Admin PIN (the same PIN you set in Vercel as ADMIN_PIN)</label>
  <input class="in" type="password" data-pin="1" value="${esc(getPin())}" placeholder="Admin PIN">
  <div class="row"><button class="btn" data-act="connect">Connect</button><button class="btn ghost" data-act="copylink">Copy link</button><button class="btn ghost" data-act="pull">Load from server</button></div>
  <div class="note" id="livemsg">${esc(liveMsg || (dirty && getPin() ? "Changes not sent yet" : "Not connected"))}</div></div>`;
}
function setLive(t) { liveMsg = t; const m = document.getElementById("livemsg"); if (m) m.textContent = t; }
function schedulePush() {
  if (VIEW || !getPin()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 1500);
}

let pushing = false, pushAgain = false, retryTimer = null, retryDelay = 5000;
function retryLater(fn) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(fn, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 60000);
}
async function getServer() {
  const r = await fetch("/api/state", { cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "error " + r.status);
  return j;
}
function adopt(j) {
  S = Object.assign(defaults(), j.state); flashTeam = null;
  store(); setSync(j.rev, false); render();
}
// Another device saved since this one last synced and this device has its own edits.
function conflict(j) {
  if (j.state && confirm("Another device saved newer data on the server.\n\nOK: load the server copy. Changes on this device that were not sent are lost.\nCancel: replace the server copy with this device's data.")) {
    adopt(j); setLive("Loaded from server at " + hhmm());
  } else { setSync(j.rev, true); pushNow(); }
}

// Checks the server before sending, so a device with old or empty data
// never overwrites newer scores without asking.
async function sync() {
  if (VIEW) return;
  if (!getPin()) { setLive("Enter the admin PIN first"); return; }
  clearTimeout(retryTimer);
  let j;
  try { j = await getServer(); }
  catch (e) { setLive("Could not reach the server (" + e.message + "). Retrying"); retryLater(sync); return; }
  retryDelay = 5000;
  if (!j.state) { setSync(j.rev, true); return pushNow(); }
  if (j.rev === serverRev) return dirty ? pushNow() : setLive("Live. Up to date at " + hhmm());
  const same = JSON.stringify(Object.assign(defaults(), j.state)) === JSON.stringify(S);
  const blank = JSON.stringify(S) === JSON.stringify(defaults());
  if (same || blank || (serverRev !== null && !dirty)) { adopt(j); setLive("Live. Loaded from server at " + hhmm()); }
  else conflict(j);
}
async function pushNow(leaving) {
  clearTimeout(pushTimer); clearTimeout(retryTimer);
  if (VIEW) return;
  if (!getPin()) { setLive("Enter the admin PIN first"); return; }
  if (serverRev === null) return sync();
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  const sent = edits;
  try {
    const r = await fetch("/api/state", { method: "POST", keepalive: leaving === true, headers: { "Content-Type": "application/json", "x-pin": getPin() }, body: JSON.stringify({ state: S, baseRev: serverRev }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      retryDelay = 5000;
      setSync(j.rev, edits !== sent);
      setLive(dirty ? "Sending…" : "Live. Saved at " + hhmm());
      if (dirty) schedulePush();
    } else if (r.status === 409) {
      if (leaving !== true) conflict(j);
    } else if (r.status === 401 || r.status === 429) {
      setLive("Not saved: " + (j.error || r.status));
    } else {
      setLive("Not saved: " + (j.error || r.status) + ". Retrying");
      retryLater(pushNow);
    }
  } catch (e) { setLive("Not saved: no internet. Retrying"); retryLater(pushNow); }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushNow(); }
}
async function pullNow() {
  try {
    const j = await getServer();
    if (!j.state) return setLive("Nothing is saved on the server yet");
    if (dirty && !confirm("Load the server copy? Changes on this device that were not sent are lost.")) return;
    adopt(j); setLive("Loaded from server at " + hhmm());
  } catch (e) { setLive("Could not load (" + e.message + ")"); }
}
async function poll() {
  if (document.hidden) return;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const j = await r.json();
    if (j && j.state) {
      const sig = JSON.stringify(j.state);
      if (sig !== lastSig) { lastSig = sig; S = Object.assign(defaults(), j.state); render(); }
      updMsg = "Updated " + hhmm();
    } else updMsg = "Waiting for the organizer";
  } catch (e) { updMsg = "No connection. Retrying"; }
  const p = document.querySelector("header p"); if (p) p.textContent = "Live scores. " + updMsg;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (busy && ["next", "all", "redo", "reset", "import", "pull"].includes(a)) return;
  if (a === "next") drawNext();
  else if (a === "all") drawAll();
  else if (a === "connect") sync();
  else if (a === "pull") pullNow();
  else if (a === "copylink") {
    const link = location.origin + "/watch";
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => setLive("Link copied: " + link), () => prompt("Copy this link:", link));
    else prompt("Copy this link:", link);
  }
  else if (a === "redo") {
    if (confirm("Redo the draw? This clears the groups and all scores.")) { S.drawn = []; S.scores = {}; S.who = {}; flashTeam = null; save(); render(); }
  } else if (a === "export") {
    const txt = JSON.stringify(S);
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => alert("Backup copied. Paste it in a note."), () => prompt("Copy this backup:", txt));
    else prompt("Copy this backup:", txt);
  } else if (a === "import") {
    const t = prompt("Paste your backup here:");
    if (t) { try { S = Object.assign(defaults(), JSON.parse(t)); save(); render(); } catch (err) { alert("This backup is not valid."); } }
  } else if (a === "reset") {
    if (confirm("Delete teams, draw and scores?")) { S = defaults(); flashTeam = null; save(); render(); }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.me) { try { localStorage.setItem("bt_me", el.value); } catch (err) {} render(); return; }
  if (el.dataset.pin) { try { localStorage.setItem("bt_pin", el.value); } catch (err) {} return; }
  if (el.dataset.t !== undefined) { S.teams[+el.dataset.t][el.dataset.f] = el.value; save(); return; }
  if (el.dataset.set) {
    const k = el.dataset.set;
    S.settings[k] = k === "start" ? (el.value || "09:00") : Math.max(0, +el.value || 0);
    save(); return;
  }
  if (el.classList.contains("sc")) {
    const m = allMatches().find(x => x.id === el.dataset.id);
    if (!m) return;
    const b = res(m), before = b.done + ":" + b.winner;
    let arr = scoresOf(m);
    if (arr !== S.scores[m.id]) arr = S.scores[m.id] = [["", ""], ["", ""], ["", ""]];
    S.who[m.id] = [m.a, m.b];
    arr[+el.dataset.g][+el.dataset.s] = el.value === "" ? "" : +el.value;
    save();
    const r = res(m), after = r.done + ":" + r.winner;
    const c = el.closest(".card");
    const s = c && c.querySelector(".st");
    if (s) { s.textContent = stat(m); s.className = "st " + (r.done ? "" : "pend"); }
    // Redraw (tables, next playoff teams) once the field is left, not mid-typing.
    if (before !== after) pendingRender = true;
  }
});

document.addEventListener("focusout", e => {
  if (pendingRender && e.target.classList.contains("sc")) setTimeout(() => { if (pendingRender) render(); }, 0);
});
// Send unsent scores before the page is closed or hidden, and when the connection returns.
document.addEventListener("visibilitychange", () => {
  if (VIEW) { if (!document.hidden) poll(); return; }
  if (document.hidden && dirty && getPin() && serverRev !== null) pushNow(true);
});
window.addEventListener("online", () => { if (!VIEW && dirty && getPin()) pushNow(); });

document.getElementById("dl-m").innerHTML = MEN.map(n => `<option value="${n}">`).join("");
document.getElementById("dl-w").innerHTML = WOMEN.map(n => `<option value="${n}">`).join("");
render();
if (VIEW) { document.title = "Live scores"; poll(); setInterval(poll, 15000); }
else if (getPin()) sync();
</script>
</body>
</html>
